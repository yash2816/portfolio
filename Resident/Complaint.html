<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaints</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #efebe9, #ffffff);
}

/* NAVBAR */
.navbar {
  background: linear-gradient(90deg, #5d4037, #8d6e63);
  color: white;
  padding: 15px 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.nav-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-menu {
  display: flex;
  gap: 15px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.nav-menu div {
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.nav-menu div:hover {
  background: rgba(255,255,255,0.2);
}

/* HEADER */
.header {
  margin: 20px;
  padding: 30px;
  border-radius: 25px;
  background: linear-gradient(135deg, #6d4c41, #a1887f);
  color: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.summary {
  display: flex;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.summary div {
  flex: 1;
  min-width: 120px;
  background: rgba(255,255,255,0.2);
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  backdrop-filter: blur(5px);
}

/* CONTAINER */
.container {
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #6d4c41;
  color: white;
  padding: 12px;
  text-align: left;
}

td {
  padding: 12px;
}

tr {
  background: white;
  transition: 0.3s;
}

tr:hover {
  background: #f5f5f5;
  transform: scale(1.01);
}

/* STATUS BADGES */
.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}

.pending {
  background: #fff3cd;
  color: #ff9800;
}

.resolved {
  background: #d4edda;
  color: green;
}

.rejected {
  background: #f8d7da;
  color: red;
}

/* BUTTON */
.btn {
  background: #6d4c41;
  color: white;
  padding: 6px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #4e342e;
}

/* FAB */
.fab {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: linear-gradient(135deg, #6d4c41, #8d6e63);
  color: white;
  border: none;
  padding: 18px;
  border-radius: 50%;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.fab:hover {
  transform: scale(1.1);
}

/* RESPONSIVE TABLE */
@media(max-width:768px){
  table, thead, tbody, th, td, tr {
    display: block;
  }

  thead {
    display: none;
  }

  tr {
    margin-bottom: 15px;
    border-radius: 12px;
    padding: 10px;
  }

  td {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    font-size: 14px;
  }

  td::before {
    content: attr(data-label);
    font-weight: 600;
    color: #5d4037;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-top">
    <h2>🏢 Milestone Society / Resident</h2>
    <div>🔔 👤</div>
  </div>

  <div class="nav-menu">
    <div onclick="go('dashboard.html')">Dashboard</div>
    <div onclick="go('My Profile.html')">My Profile</div>
    <div onclick="go('My Maintenance.html')">My Maintenance</div>
    <div>Complaints</div>
    <div onclick="go('Notice.html')">Notices</div>
    <div onclick="go('Visitors.html')">Visitors</div>
    <div onclick="logout()">Logout</div>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <h2>🛠 My Complaints</h2>

  <div class="summary">
    <div>
      <h3>05</h3>
      <p>Total</p>
    </div>
    <div>
      <h3>02</h3>
      <p>Pending</p>
    </div>
    <div>
      <h3>03</h3>
      <p>Resolved</p>
    </div>
  </div>
</div>

<!-- TABLE -->
<div class="container">
  <h3>Complaint Records</h3>

  <table>
    <tr>
      <th>Flat</th>
      <th>Issue</th>
      <th>Status</th>
      <th>Action</th>
    </tr>

    <tr>
      <td data-label="Flat">A-101</td>
      <td data-label="Issue">Water Leakage</td>
      <td data-label="Status"><span class="status pending">Pending</span></td>
      <td data-label="Action">
        <button class="btn" onclick="viewComplaint('A-101','Water Leakage','Pending')">View</button>
      </td>
    </tr>

    <tr>
      <td data-label="Flat">A-102</td>
      <td data-label="Issue">Lift Issue</td>
      <td data-label="Status"><span class="status resolved">Resolved</span></td>
      <td data-label="Action">
        <button class="btn" onclick="viewComplaint('A-102','Lift Issue','Resolved')">View</button>
      </td>
    </tr>

  </table>
</div>

<!-- FAB -->
<button class="fab" onclick="addComplaint()">+</button>

<script>
function go(page){
  window.location.href = page;
}

function logout(){
  alert("Logged out!");
}

function viewComplaint(flat, issue, status){
  localStorage.setItem("flat", flat);
  localStorage.setItem("issue", issue);
  localStorage.setItem("status", status);

  window.location.href = "complaint-detail.html";
}

function addComplaint(){
  alert("Open Add Complaint Form");
}
</script>

</body>
</html>
