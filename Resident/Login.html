<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Society Resident Login</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color:white;
    }

    .container {
      width: 450px;
      height: 350px;
      padding: 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      text-align: center;
      color: #fff;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 35px;
    }

    .input-box {
      position: relative;
      margin: 20px 0;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 14px;
    }

    .input-box input::placeholder {
      color: #eee;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ddd;
    }

    .error {
      color: #ff4d4d;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
    }

    /* Responsive */
    @media (max-width: 400px) {
      .container {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="container" style="background-color:brown;">
    <h2>Resident Login</h2>

    <div class="input-box">
      <input type="email" id="email" placeholder="Enter Email">
      <div class="error" id="emailError">Invalid Email</div>
    </div>

    <div class="input-box">
      <input type="password" id="password" placeholder="Enter Password">
      <div class="error" id="passError">Password must be 6+ characters</div>
    </div>

    <button class="btn" onclick="login()" style="font-size: 15px;">Login</button>

    <div class="footer" style="font-size: 20px;">
      Residential Panel
    </div>
  </div>

  <script>
    function login() {
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      let emailError = document.getElementById("emailError");
      let passError = document.getElementById("passError");

      let valid = true;

      // Email validation
      if (!email.includes("@")) {
        emailError.style.display = "block";
        valid = false;
      } else {
        emailError.style.display = "none";
      }

      // Password validation
      if (password.length < 6) {
        passError.style.display = "block";
        valid = false;
      } else {
        passError.style.display = "none";
      }

      if (valid) {
        alert("Login Successful!");
        
        // Redirect to dashboard
        window.location.href = "dashboard.html";
      }
    }
  </script>

</body>
</html>
