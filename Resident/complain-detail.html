<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Details</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f7fa;
    padding:30px;
}

/* Main Container */
.container{
    max-width:1100px;
    margin:auto;
}

/* Title */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    font-size:30px;
    color:#222;
}

.back-btn{
    text-decoration:none;
    background:#4f46e5;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    transition:0.3s;
}

.back-btn:hover{
    background:#3730a3;
}

/* Cards */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

/* Card */
.card{
    background:#fff;
    padding:25px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.card h2{
    font-size:22px;
    margin-bottom:20px;
    color:#111827;
    border-bottom:2px solid #eee;
    padding-bottom:10px;
}

.detail{
    margin-bottom:15px;
}

.detail label{
    display:block;
    font-size:14px;
    color:#777;
    margin-bottom:5px;
}

.detail span{
    font-size:16px;
    color:#111;
    font-weight:500;
}

/* Complaint Description */
.description{
    line-height:1.7;
    color:#444;
    background:#f9fafb;
    padding:15px;
    border-radius:10px;
    margin-top:10px;
}

/* Status Badge */
.status{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
}

.pending{
    background:#fff7d6;
    color:#b7791f;
}

.progress{
    background:#dbeafe;
    color:#2563eb;
}

.resolved{
    background:#dcfce7;
    color:#16a34a;
}

/* Buttons */
.actions{
    margin-top:25px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:500;
    transition:0.3s;
}

.btn-progress{
    background:#2563eb;
    color:#fff;
}

.btn-progress:hover{
    background:#1d4ed8;
}

.btn-resolve{
    background:#16a34a;
    color:#fff;
}

.btn-resolve:hover{
    background:#15803d;
}

.btn-delete{
    background:#ef4444;
    color:#fff;
}

.btn-delete:hover{
    background:#dc2626;
}

/* Responsive */
@media(max-width:768px){
    .header{
        flex-direction:column;
        gap:15px;
        align-items:flex-start;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Complaint Details</h1>
        <a href="#" class="back-btn">← Back</a>
    </div>

    <div class="grid">

        <!-- Resident Info -->
        <div class="card">
            <h2>Resident Information</h2>

            <div class="detail">
                <label>Name</label>
                <span>Rahul Sharma</span>
            </div>

            <div class="detail">
                <label>Flat No</label>
                <span>B-302</span>
            </div>

            <div class="detail">
                <label>Phone</label>
                <span>+91 9876543210</span>
            </div>

            <div class="detail">
                <label>Email</label>
                <span>rahul@email.com</span>
            </div>
        </div>

        <!-- Complaint Info -->
        <div class="card">
            <h2>Complaint Information</h2>

            <div class="detail">
                <label>Complaint ID</label>
                <span>#CMP1025</span>
            </div>

            <div class="detail">
                <label>Category</label>
                <span>Water Leakage</span>
            </div>

            <div class="detail">
                <label>Date</label>
                <span>20 April 2026</span>
            </div>

            <div class="detail">
                <label>Status</label>
                <span class="status pending">Pending</span>
            </div>

            <div class="detail">
                <label>Description</label>
                <div class="description">
                    Water leakage issue in kitchen ceiling since last 3 days. Please send maintenance staff urgently.
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-progress">Mark In Progress</button>
                <button class="btn btn-resolve">Resolve</button>
                <button class="btn btn-delete">Delete</button>
            </div>

        </div>

    </div>

</div>

</body>
</html>
