<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vamanya Jewellery - Cart</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f5f5f5;
}

.navbar{
    background:#c39b34;
    padding:15px 30px;
    color:black;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.navbar h1{
    font-size:30px;
}
.navbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:500;
}

/* Cart */

.cart-container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

.cart-container h2{
    margin-bottom:20px;
    color:#5a3300;
}

.cart-item{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.cart-item img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
}

.product-details{
    flex:1;
    margin-left:20px;
}

.product-details h3{
    color:#5a3300;
    margin-bottom:10px;
}

.product-details p{
    color:#b8860b;
    font-size:22px;
    font-weight:bold;
}

.quantity-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity-box button{
    width:35px;
    height:35px;
    border:none;
    background:#5a3300;
    color:white;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}

.qty{
    font-size:18px;
    font-weight:bold;
}

.item-total{
    font-size:20px;
    font-weight:bold;
    color:#b8860b;
}

.remove-btn{
    background:red;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
}

.cart-summary{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:right;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.cart-summary h3{
    color:#5a3300;
    margin-bottom:15px;
}

.checkout-btn{
    background:#b8860b;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.checkout-btn:hover{
    background:#5a3300;
}

/* Responsive */

@media(max-width:768px){

.cart-item{
    flex-direction:column;
    text-align:center;
    gap:15px;
}

.product-details{
    margin-left:0;
}

.cart-summary{
    text-align:center;
}

}
</style>
</head>
<body>

<div class="navbar">
    <h1 class="logo">Vamanya</h1>
    <div class="nav-icons">
        <a href="customer_dashboard.php"><span>Dashboard</span></a>
        <a href="customer_profile.php"><span>Profile</span></a>
    </div>
</div>


<section class="cart-container">

    <h2>My Shopping Cart</h2>

    <div class="cart-item">

        <img src="images/Rings/Art Deco Oval.jpg" alt="Art Deco Oval Ring">

        <div class="product-details">
            <h3>Art Deco Oval Ring</h3>
            <p>₹25,000</p>
        </div>

        <div class="quantity-box">
            <button onclick="decrease(this)">-</button>
            <span class="qty">1</span>
            <button onclick="increase(this)">+</button>
        </div>

        <div class="item-total">₹25000</div>

        <button class="remove-btn" onclick="removeItem(this)">
            Remove
        </button>

    </div>


    <div class="cart-item">

        <img src="images/Necklaces/Emerald Leaf Necklace.jpg" alt="Emerald Leaf Necklace">

        <div class="product-details">
            <h3>Emerald Leaf Necklace</h3>
            <p>₹15,000</p>
        </div>

        <div class="quantity-box">
            <button onclick="decrease(this)">-</button>
            <span class="qty">1</span>
            <button onclick="increase(this)">+</button>
        </div>

        <div class="item-total">₹15000</div>

        <button class="remove-btn" onclick="removeItem(this)">
            Remove
        </button>

    </div>

    <div class="cart-summary">

        <h3>Total: ₹<span id="grandTotal">40000</span></h3>

        <button class="checkout-btn">
            Proceed To Checkout
        </button>

    </div>

</section>

<script>
    function increase(button){

    let qtyElement =
    button.parentElement.querySelector(".qty");

    let qty =
    parseInt(qtyElement.innerText);

    qty++;

    qtyElement.innerText = qty;

    updateTotal();
}

function decrease(button){

    let qtyElement =
    button.parentElement.querySelector(".qty");

    let qty =
    parseInt(qtyElement.innerText);

    if(qty > 1){
        qty--;
    }

    qtyElement.innerText = qty;

    updateTotal();
}

function removeItem(button){

    button.parentElement.remove();

    updateTotal();
}

function updateTotal(){

    let items =
    document.querySelectorAll(".cart-item");

    let grandTotal = 0;

    items.forEach(item => {

        let price =
        parseInt(
        item.querySelector(".product-details p")
        .innerText.replace(/[₹,]/g,'')
        );

        let qty =
        parseInt(
        item.querySelector(".qty").innerText
        );

        let total = price * qty;

        item.querySelector(".item-total")
        .innerText = "₹" + total.toLocaleString();

        grandTotal += total;
    });

    document.getElementById("grandTotal")
    .innerText = grandTotal.toLocaleString();
}
</script>

</body>
</html>
