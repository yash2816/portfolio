<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Signup - VAMANYA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f8f3ee,#f4e1d2);
}

.signup-container{
    width:100%;
    max-width:700px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#b8860b;
    font-size:32px;
    letter-spacing:2px;
}

.logo p{
    color:#777;
    font-size:14px;
}

.signup-form h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    color:#555;
    font-weight:500;
}

.input-group input{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#b8860b;
    box-shadow:0 0 5px rgba(184,134,11,0.4);
}

.signup-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#b8860b;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.signup-btn:hover{
    background:#9c7209;
}

.login-link{
    text-align:center;
    margin-top:18px;
}

.login-link a{
    text-decoration:none;
    color:#b8860b;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

@media(max-width:600px){

.signup-container{
    margin:20px;
    padding:25px;
}

.logo h1{
    font-size:26px;
}

}

</style>
</head>
<body>

<div class="signup-container">

    <div class="logo">
        <h1>VAMANYA</h1>
        <p>Luxury Jewellery Collection</p>
    </div>

    <form class="signup-form" action="customer_signup.php" method="POST">

        <h2>Create Account</h2>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="customer_name" placeholder="Enter Full Name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="customer_email" placeholder="Enter Email Address" required>
        </div>

        <div class="input-group">
            <label>Mobile Number</label>
            <input type="tel" name="customer_mobile" placeholder="Enter Mobile Number" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="customer_password" placeholder="Create Password" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        </div>

        <div class="input-group">
            <label>Address</label>
            <input type="text" name="customer_address" placeholder="Enter Address" required>
        </div>

        <div class="input-group">
            <label>City</label>
            <input type="text" name="customer_city" placeholder="Enter City" required>
        </div>

        <div class="input-group">
            <label>State</label>
            <input type="text" name="customer_state" placeholder="Enter State" required>
        </div>

        <div class="input-group">
            <label>Postal Code</label>
            <input type="text" name="customer_postal_code" placeholder="Enter Postal Code" required>
        </div>

        <div class="input-group">
            <label>Gender</label>
            <input type="text" name="customer_gender" placeholder="Enter Gender" required >
        </div>

        <button type="submit" class="signup-btn">
            Create Account
        </button>

        <div class="login-link">
            Already have an account?
            <a href="customer_login.html">Login</a>
        </div>

    </form>

</div>

</body>
</html>
