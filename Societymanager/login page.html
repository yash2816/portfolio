<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Secretary Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#ffffff;
}

/* Light background decoration */
body::before{
    content:"";
    position:fixed;
    width:550px;
    height:550px;
    background:#4F46E5;
    border-radius:50%;
    top:-180px;
    right:-180px;
    opacity:.08;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    background:#6366F1;
    border-radius:50%;
    bottom:-180px;
    left:-180px;
    opacity:.08;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:430px;
    background:#ffffff;
    border-radius:22px;
    padding:40px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
    border:1px solid #ececec;
    z-index:10;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#4F46E5,#6366F1);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:36px;
    box-shadow:0 8px 20px rgba(79,70,229,.35);
}

.login-box h2{
    text-align:center;
    margin-top:20px;
    color:#1f2937;
    font-size:28px;
}

.login-box p{
    text-align:center;
    color:#6b7280;
    margin:10px 0 30px;
}

.input-box{
    position:relative;
    margin-bottom:22px;
}

.input-box input{
    width:100%;
    padding:15px 50px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    font-size:15px;
    background:#f9fafb;
    color:#1f2937;
    transition:.3s;
}

.input-box input:focus{
    border-color:#4F46E5;
    background:#fff;
    box-shadow:0 0 0 4px rgba(79,70,229,.12);
}

.input-box input::placeholder{
    color:#9ca3af;
}

.input-box i:first-child{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#6b7280;
}

#togglePassword{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#6b7280;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.options label{
    color:#374151;
}

.options a{
    text-decoration:none;
    color:#4F46E5;
    font-weight:500;
}

.options a:hover{
    text-decoration:underline;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#4F46E5,#6366F1);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.35s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(79,70,229,.35);
}

.loading{
    pointer-events:none;
    opacity:.8;
}

@media(max-width:500px){

.login-box{
    width:100%;
    padding:30px 25px;
}

.login-box h2{
    font-size:24px;
}

}
</style>
<body>

<div class="container">

    <div class="login-box">

        <div class="logo">
    <i class="fa-solid fa-building-user"></i>
</div>

<h2>Society Secretary</h2>
<p>Manage your society securely and efficiently.</p>

        <form id="loginForm">

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>
            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="password"
                placeholder="Password"
                required>

                <span id="togglePassword">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" id="loginBtn">
    <i class="fa-solid fa-right-to-bracket"></i>
    Login
</button>

        </form>

    </div>

</div>
<script>
const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.addEventListener("click", () => {

    if (password.type === "password") {
        password.type = "text";
        togglePassword.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
    } else {
        password.type = "password";
        togglePassword.innerHTML = '<i class="fa-solid fa-eye"></i>';
    }

});

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");

form.addEventListener("submit", (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const pass = password.value.trim();

    if (email === "" || pass === "") {
        alert("Please fill all fields");
        return;
    }

    btn.classList.add("loading");
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging In...';

    setTimeout(() => {

        // Redirect to another page
        window.location.href = "dashboard.html";

    }, 2000);

});
</script>

</body>
</html>
