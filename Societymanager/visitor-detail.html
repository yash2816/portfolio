<!DOCTYPE html>
<html>
<head>
<title>Visitor Details</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #e3f2fd, #ffffff);
}

.container {
  margin: 40px;
  padding: 30px;
  border-radius: 20px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
}

.detail {
  margin: 10px 0;
  font-size: 18px;
}

.btn {
  margin-top: 20px;
  padding: 10px;
  background: #3f51b5;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🔐 Visitor Details</h2>

  <div class="detail"><b>Name:</b> <span id="name"></span></div>
  <div class="detail"><b>Flat No:</b> <span id="flat"></span></div>
  <div class="detail"><b>Purpose:</b> <span id="purpose"></span></div>
  <div class="detail"><b>Entry Time:</b> <span id="time"></span></div>
  <div class="detail"><b>Status:</b> <span id="status"></span></div>

  <button class="btn" onclick="back()">⬅ Back</button>
</div>

<script>
document.getElementById("name").innerText = localStorage.getItem("name");
document.getElementById("flat").innerText = localStorage.getItem("flat");
document.getElementById("purpose").innerText = localStorage.getItem("purpose");
document.getElementById("time").innerText = localStorage.getItem("time");
document.getElementById("status").innerText = localStorage.getItem("status");

function back(){
  window.history.back();
}
</script>

</body>
</html>
