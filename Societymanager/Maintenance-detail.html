<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Details</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #e3f2fd, #ffffff);
}

/* NAVBAR */
.navbar {
  background: linear-gradient(90deg, #3f51b5, #5c6bc0);
  color: white;
  padding: 15px 25px;
}

/* CONTAINER */
.container {
  margin: 40px;
  padding: 30px;
  border-radius: 20px;

  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);

  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.detail {
  margin: 10px 0;
  font-size: 18px;
}

.btn {
  margin-top: 20px;
  padding: 10px 15px;
  border: none;
  background: #3f51b5;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <h2>💰 Maintenance Details</h2>
</div>

<div class="container">
  <h2>Payment Information</h2>

  <div class="detail"><b>Flat No:</b> <span id="flat"></span></div>
  <div class="detail"><b>Name:</b> <span id="name"></span></div>
  <div class="detail"><b>Status:</b> <span id="status"></span></div>
  <div class="detail"><b>Amount:</b> <span id="amount"></span></div>

  <button class="btn" onclick="goBack()">⬅ Back</button>
</div>

<script>
document.getElementById("flat").innerText = localStorage.getItem("flat");
document.getElementById("name").innerText = localStorage.getItem("name");
document.getElementById("status").innerText = localStorage.getItem("status");
document.getElementById("amount").innerText = localStorage.getItem("amount");

function goBack(){
  window.history.back();
}
</script>

</body>
</html>
